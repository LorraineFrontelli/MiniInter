<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Aplicando tema salvo -->
    <script>document.documentElement.style.setProperty("--tema",localStorage.getItem("corTema")||"#242021");</script>
 
    <!-- Preloads -->
    <link rel="preload" as="image" href="../../../assets/img/painting-back-icon.svg">
    <link rel="preload" as="image" href="../../../assets/img/profile-icon.svg">
    <link rel="preload" as="image" href="../../../assets/img/schedule-icon.svg">
    <link rel="preload" as="image" href="../../../assets/img/grades-icon.svg">
    <link rel="preload" as="image" href="../../../assets/img/observations-icon.svg">

    <!-- Links -->
    <link rel="stylesheet" href="../../../assets/css/global.css">
    <link rel="stylesheet" href="../../../assets/css/tokens.css">
    <link rel="stylesheet" href="../../../assets/css/layout/crud.css">
    <link rel="icon" type="image/x-icon" href="../../../assets/img/favicon.ico">
    <script src="../../../assets/js/script.js" defer></script>

    <title>CRUD - Monart</title>
</head>

<body>
    <div class="meuPlaceholder"></div>

    <header class="headerLateral">
        <img src="../../../assets/img/monart-logo.svg" decoding="async" alt="" class="logoMonart">
        <nav>
            <ul>
                <li><a href="tab-administrador.html" class="pagina"><img src="../../../assets/img/schedule-icon.svg" decoding="async" alt="">Administrador</a></li>
                <li><a href="tab-aluno.html" class="pagina"><img src="../../../assets/img/schedule-icon.svg" decoding="async" alt="">Aluno</a></li>
                <li><a href="tab-professor.html" class="pagina ativo"><img src="../../../assets/img/schedule-icon.svg" decoding="async" alt="">Professor</a></li>
                <li><a href="tab-aluno-professor.html" class="pagina"><img src="../../../assets/img/schedule-icon.svg" decoding="async" alt="">Aluno Professor</a></li>
                <li><a href="tab-boletim.html" class="pagina"><img src="../../../assets/img/schedule-icon.svg" decoding="async" alt="">Boletim</a></li>
                <li><a href="tab-telefone.html" class="pagina"><img src="../../../assets/img/schedule-icon.svg" decoding="async" alt="">Telefone</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="cabecalhoPaginas">
            <a href="../autenticacao/login.html">
                <img src="../../../assets/img/painting-back-icon.svg" alt="Ícone de voltar" class="pincelVoltar">
            </a>
            <div class="tituloPaginas">
                <h1>Professor</h1>
            </div>
            <img src="../../../assets/img/themes-icon.svg" alt="" class="abrirTemas">
        </div>
        
        <div class="componentizacao">
            <search>
                <form action="" method="">
                    <input type="search" id="buscarCrud" class="buscarCrud" name="buscarCrud" placeholder="Pesquisar">
                </form>
            </search>

            <button class="botaoInsert" onclick="create.showModal()">
                Fazer inserção
                <img src="../../../assets/img/plus-icon.svg" alt="">
            </button>
        </div>

        <div class="tabelaContainer">
            <table class="tabelaRead">
                <thead>
                    <tr>
                        <th>Ações</th>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Senha</th>
                        <th>Matéria</th>
                        <th>Data de Contratação</th>
                        <th>Usuário</th>
                    </tr>
              </thead>
              
              <tbody>
                    <tr>
                        <td class="opcoes">
                            <div>
                                <img src="../../../assets/img/update-icon.svg" alt="" class="botaoUpdate" onclick="update.showModal()">
                                <img src="../../../assets/img/delete-icon.svg" alt="" class="botaoDelete" onclick="deletes.showModal()">
                            </div>
                        </td>
                        <td>Teoria das Cores</td>
                        <td>9.45</td>
                        <td>7.50</td>
                        <td>7.50</td>
                        <td>7.50</td>
                        <td>Em processo</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Create -->
    <dialog class="create" id="create">
        <button class="fecharPopUp" onclick="create.close()">X</button>
        <form action="">
            <div class="colunas">
                <div class="coluna">
                    <label for="createNome">Nome</label>
                    <input type="text" name="createNome" id="createNome">
                
                    <label for="createEmail">E-mail</label>
                    <input type="email" name="createEmail" id="createEmail">
                
                    <label for="createSenha">Senha</label>
                    <input type="password" name="createSenha" id="createSenha">
                </div>
                
                <div class="coluna">
                    <label for="createMateria">Matéria</label>
                    <input type="text" name="createMateria" id="createMateria">
                    
                    <label for="createDtContratacao">Data Contratação</label>
                    <input type="date" name="createDtContratacao" id="createDtContratacao">
                
                    <label for="createUsuario">Usuário</label>
                    <input type="text" name="createUsuario" id="createUsuario">
                </div>
            </div>
            
            <button class="salvarInsercao">Inserir</button>
        </form>
    </dialog>

    <!-- Update -->
    <dialog class="update" id="update">
        <button class="fecharPopUp" onclick="update.close()">X</button>
        <form action="">
            <div class="colunas">
                <div class="coluna">
                    <label for="updateNome">Nome</label>
                    <input type="text" name="updateNome" id="updateNome">

                    <label for="updateEmail">E-mail</label>
                    <input type="email" name="updateEmail" id="updateEmail">
                    
                    <label for="updateSenha">Senha</label>
                    <input type="password" name="updateSenha" id="updateSenha">
                </div>
                
                <div class="coluna">
                    <label for="updateMateria">Matéria</label>
                    <input type="text" name="updateMateria" id="updateMateria">

                    <label for="updateDtContratacao">Data Contratação</label>
                    <input type="date" name="updateDtContratacao" id="updateDtContratacao">

                    <label for="updateUsuario">Usuário</label>
                    <input type="text" name="updateUsuario" id="updateUsuario">
                </div>
            </div>

            <button class="salvarAlteracoes">Atualizar</button>
        </form>
    </dialog>

    <!-- Delete -->
    <dialog class="deletes" id="deletes">
        <button class="fecharPopUp" onclick="deletes.close()">X</button>
        <form action="">
            <h2>Deseja realmente excluir?</h2>

            <div>
                <button class="cancelarDeletar">Cancelar</button>
                <button class="deletar">Excluir</button>
            </div>
        </form>
    </dialog>
</body>
</html>
